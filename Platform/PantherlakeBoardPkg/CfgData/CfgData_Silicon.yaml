  - EcAvailable :
      name         : Embedded Controller Availability
      type         : Constant, Combo
      option       : $EN_DIS
      help         : >
                     Enable or disable Embedded Controller
      length       : 0x01
      value        : 0x1
  - IshGpGpioPinMuxing :
