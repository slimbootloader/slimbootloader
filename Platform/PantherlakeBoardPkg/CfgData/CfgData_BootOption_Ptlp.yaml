#ImageType, BootFlags,   Reserved, BootDeviceType, BootDeviceInstance, HwPart, SwPart,FsType, Image
#BDT: 0:SATA, 1:SD, 2:EMMC, 3:UFS, 4:SPI, 5:USB, 6:NVME, 7:MEMORY
#
- $ACTION      :
    page         : OS
# nvme
- !expand { BOOT_OPTION_TMPL : [ 0 ,   0       ,  0 ,    6   ,   1   ,    0     ,     1,     1 , '/boot/sbl_os' ] }
- !expand { BOOT_OPTION_TMPL : [ 1 ,   0x1F    ,  0 ,    6   ,   1   ,    0     ,     1,     1 , '!IPFW/POSC' ] }
- !expand { BOOT_OPTION_TMPL : [ 2 ,   0       ,  0 ,    6   ,   0   ,    0     ,     1,     1 , '/boot/sbl_os' ] }
- !expand { BOOT_OPTION_TMPL : [ 3 ,   0x1F    ,  0 ,    6   ,   0   ,    0     ,     1,     1 , '!IPFW/POSC' ] }
# usb
- !expand { BOOT_OPTION_TMPL : [ 4 ,   0       ,  0 ,    5   ,   0   ,    0xFF  ,     1 ,     1 , '/boot/sbl_os' ] }
- !expand { BOOT_OPTION_TMPL : [ 5 ,   0x1F    ,  0 ,    5   ,   0   ,    0     ,     1 ,     1 , '!IPFW/POSC' ] }
