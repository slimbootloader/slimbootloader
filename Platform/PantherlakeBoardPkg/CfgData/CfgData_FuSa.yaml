$ACTION      :
    page         : FUSA:GEN:"FuSa Settings"
- $ACTION      :
    page         : FUSA
- FUSA_CFG_DATA :
  - !expand { CFGHDR_TMPL : [ FUSA_CFG_DATA, 0x210, 0, 0 ] }
  - Module0Lockstep :
      name         : Fusa Module 0 Lockstep Configuration
      type         : Combo
      option       : 0: Disable lockstep, 1: Enable lockstep for Core 0 with Core 1; Core 2 with Core 3, 2: Enable lockstep for Core 0 with Core 1, 3: Enable lockstep for Core 2 with Core 3
      help         : >
                     Enable/Disable Lockstep for Atom module 0, which has 4 cores;
      length       : 0x01
      value        : 0x0
  - Module1Lockstep :
      name         : Fusa Module 1 Lockstep Configuration
      type         : Combo
      option       : 0: Disable lockstep, 1: Enable lockstep for Core 0 with Core 1; Core 2 with Core 3, 2: Enable lockstep for Core 0 with Core 1, 3: Enable lockstep for Core 2 with Core 3
      help         : >
                     Enable/Disable Lockstep for Atom module 1, which has 4 cores;
      length       : 0x01
      value        : 0x0
  - FusaPlatformParityChecking :
      name         : Fusa Platform Parity Checking
      type         : Combo
      option       : $EN_DIS
      help         : >
                     Enable/Disable Fusa Platform Parity Checking
      length       : 0x01
      value        : 0x0
  - DiagGspiCtrlr :
      name         : Index of GSPI controller to send FuSa diagnostic results.
      type         : EditNum, DEC, (0,2)
      help         : >
                     GSPI Controller index for sending FuSa diagnostic results. RPL-P supports 0, 1, or 2.
      length       : 0x01
      value        : 0x0
  - LpcLockstep :
      name         : Fusa LPC Lockstep Configuration
      type         : Combo
      option       : 0: Disable lockstep, 1: Enable lockstep for Core 0 with Core 1; Core 2 with Core 3, 2: Enable lockstep for Core 0 with Core 1, 3: Enable lockstep for Core 2 with Core 3
      help         : >
                     Enable/Disable Lockstep for Atom Lpc module, which has 4 cores;
      length       : 0x01
      value        : 0x0
  - Posc :
      name         : Fusa Pre-OS Checker Configuration
      type         : Combo
      option       : $EN_DIS
      help         : >
                     Enable/Disable Pre-OS Checker configuration
      length       : 0x01
      value        : 0x0
  - CpuCrashLogEnable :
      name         : CPU CrashLog support
      type         : Combo
      option       : $EN_DIS
      help         : >
                     Enable CrashLog feature in CPU.
      length       : 0x01
      value        : 0x0
