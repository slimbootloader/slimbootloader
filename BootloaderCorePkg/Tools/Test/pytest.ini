[pytest]
# Kept inside the test folder so the repository root stays free of tool
# configuration files.
testpaths = .
python_files = test_*.py
addopts = -ra
# Platform/AlderlakeBoardPkg/BoardConfigAdlN.py contains regex strings with
# unescaped backslashes. That is a pre-existing cosmetic issue in a file this
# suite only imports, so it is silenced rather than left to bury real output.
filterwarnings =
    ignore::SyntaxWarning
